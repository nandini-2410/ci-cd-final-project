apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean the workspace before running the pipeline.
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3.19
      script: |
        #!/bin/sh
        rm -rf "$(workspaces.source.path)"/*
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: tests
spec:
  description: Run unit tests using nose.
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        pip install -r requirements.txt
        pip install nose
        nosetests
